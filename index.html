<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хочу побывать</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{
  --bg:#f7f8f7;--fg:#182328;--hint:#7b858a;--acc:#087f83;--accfg:#fff;
  --sec:#eef1f0;--line:#18232814;--map:#dfe5e4;
  --shadow:0 8px 28px #00000018;--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101314;--fg:#f1f4f3;--hint:#899394;--acc:#38aeb0;--accfg:#071314;
    --sec:#1b2021;--line:#ffffff12;--map:#202627;--shadow:0 10px 32px #00000055;
  }
}
html[data-theme="light"]{
  --bg:#f7f8f7;--fg:#182328;--hint:#7b858a;--acc:#087f83;--accfg:#fff;
  --sec:#eef1f0;--line:#18232814;--map:#dfe5e4;--shadow:0 8px 28px #00000018;
}
html[data-theme="dark"]{
  --bg:#101314;--fg:#f1f4f3;--hint:#899394;--acc:#38aeb0;--accfg:#071314;
  --sec:#1b2021;--line:#ffffff12;--map:#202627;--shadow:0 10px 32px #00000055;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);
  font:15px/1.35 system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif
}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;transition:transform .18s var(--ease),background .22s,opacity .22s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#map{position:fixed;inset:0;width:100%;height:100%;min-height:100vh;background:var(--map);z-index:0}
.float{position:fixed;z-index:500}

/* Search — flat and light */
#search{
  top:calc(12px + env(safe-area-inset-top));left:12px;right:66px;max-width:470px;
  display:flex;align-items:center;background:var(--bg);border-radius:15px;
  box-shadow:var(--shadow);padding-left:13px;transition:box-shadow .25s var(--ease)
}
#search:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent),var(--shadow)}
#search svg{width:18px;height:18px;flex:none;stroke:var(--hint);fill:none;stroke-width:2.2;stroke-linecap:round}
#search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 9px;font-size:16px;outline:0}
#search input::placeholder{color:var(--hint)}
#search button{background:var(--acc);color:var(--accfg);padding:8px 12px;border-radius:10px;margin:4px;font-size:13px;font-weight:650}
#fabs{top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;flex-direction:column;gap:8px}
.fab{
  width:46px;height:46px;border-radius:14px;background:var(--bg);
  box-shadow:var(--shadow);display:grid;place-items:center
}
.fab svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Messages */
#hint{
  left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);
  background:#182328e8;color:#fff;padding:8px 14px;border-radius:99px;font-size:12.5px;
  white-space:nowrap;pointer-events:none;transition:opacity .45s var(--ease)
}
#hint.off{opacity:0}
#toast{
  left:50%;top:calc(72px + env(safe-area-inset-top));transform:translate(-50%,-8px);
  opacity:0;pointer-events:none;display:flex;align-items:center;gap:9px;
  background:#182328f5;color:#fff;padding:7px 7px 7px 14px;border-radius:13px;
  box-shadow:var(--shadow);transition:.28s var(--ease);max-width:calc(100% - 24px)
}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast button{background:#ffffff20;color:#fff;padding:6px 10px;border-radius:9px;font-weight:650}

/* Sheet — lighter, cleaner, smoother */
#sheet{
  position:fixed;z-index:600;left:0;right:0;bottom:0;height:80dvh;
  display:flex;flex-direction:column;background:var(--bg);
  border-radius:24px 24px 0 0;box-shadow:0 -8px 30px #00000020;
  transform:translateY(var(--ty,68dvh));transition:transform .42s cubic-bezier(.16,1,.3,1);
  will-change:transform;overflow:hidden
}
#sheet.dragging{transition:none}
#head{padding:8px 18px 11px;touch-action:none;user-select:none;cursor:grab}
#grab{width:34px;height:4px;border-radius:99px;background:color-mix(in srgb,var(--fg) 18%,transparent);margin:0 auto 13px}
#head h1{margin:0;font-size:22px;line-height:1.05;font-weight:750;letter-spacing:-.025em}
#count{color:var(--hint);font-size:12.5px;margin-top:4px}

/* Minimal tabs */
#tabs{
  display:flex;gap:2px;margin:0 14px 8px;padding:3px;background:var(--sec);border-radius:12px
}
#tabs button{
  flex:1;padding:7px 6px;border-radius:9px;background:transparent;color:var(--hint);
  font-size:13px;font-weight:600
}
#tabs button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px #00000012}

/* List */
#list{
  flex:1;min-height:0;overflow:auto;padding:2px 10px calc(var(--hide,0px) + 14px + env(safe-area-inset-bottom));
  overscroll-behavior:contain
}
.item{
  display:flex;align-items:center;gap:10px;padding:8px 7px;margin:2px 0;
  border-radius:14px;cursor:pointer;transition:background .2s var(--ease),transform .2s var(--ease);
  animation:in .3s var(--ease) backwards
}
.item:hover{background:var(--sec)}
.item:active{transform:scale(.992)}
.item.flash{background:color-mix(in srgb,var(--acc) 11%,var(--bg))}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.chk{
  flex:none;width:31px;height:31px;border-radius:50%;
  border:1.8px solid color-mix(in srgb,var(--acc) 50%,transparent);
  background:transparent;display:grid;place-items:center;color:transparent;transition:.2s
}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.txt{flex:1;min-width:0}
.name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.date{display:block;font-size:11.5px;color:var(--hint);margin-top:1px}
.done .name{color:var(--hint);text-decoration:line-through}
.del{flex:none;width:30px;height:30px;border-radius:9px;background:transparent;color:var(--hint);font-size:12px;opacity:.5}
.del:hover{background:color-mix(in srgb,#d95743 12%,transparent);color:#d95743;opacity:1}
.empty{
  padding:24px 16px;color:var(--hint);text-align:center;line-height:1.5;
  border:1px dashed var(--line);border-radius:16px;margin:7px 3px
}
.credits{padding:9px 8px 0;text-align:center;font-size:10px;color:var(--hint);opacity:.6}

/* Form */
#form{display:none;flex-direction:column;gap:8px;padding:2px 14px 14px}
#form label{font-size:12px;color:var(--hint)}
#form input{
  padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--sec);
  font-size:16px;outline:0;transition:border-color .2s,box-shadow .2s
}
#form input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 10%,transparent)}
#form .row{display:flex;gap:7px}
#form .row button{padding:12px 16px;border-radius:12px;background:var(--sec);font-weight:600}
#form .row .main{flex:1;background:var(--acc);color:var(--accfg);font-weight:700}
body.drafting #form{display:flex;animation:in .25s var(--ease)}
body.drafting #list,body.drafting #tabs{display:none}

/* Pins */
.pin{width:32px;height:40px;color:var(--acc);filter:drop-shadow(0 3px 3px #0004);transform-origin:50% 100%}
.pin svg{width:100%;height:100%;display:block}
.pin.done{color:var(--done)}.pin.draft{color:#d95743}
.pin.new{animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.7)}}
.me{width:15px;height:15px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 7px #2f7cf62e}
.leaflet-tooltip{border:0;border-radius:8px;box-shadow:var(--shadow);font:600 12px system-ui;padding:5px 8px}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{width:38px!important;height:38px!important;line-height:38px!important;background:var(--bg);color:var(--fg);border-color:var(--line)!important}
.leaflet-control-attribution{background:var(--bg)!important;color:var(--hint)!important;border-radius:7px 0 0 0;padding:3px 6px!important;font-size:9px}
.leaflet-control-attribution a{color:var(--hint)!important}

/* Theme switch */
#theme{
  position:fixed;z-index:700;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  width:42px;height:42px;border-radius:13px;background:var(--bg);box-shadow:var(--shadow);
  display:grid;place-items:center
}
#theme svg{width:19px;height:19px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media (min-width:800px){
  #sheet{
    top:12px;bottom:12px;left:12px;right:auto;width:390px;height:auto;
    border-radius:22px;transform:none;box-shadow:var(--shadow)
  }
  #head{cursor:default;touch-action:auto;padding:21px 20px 12px}
  #grab{display:none}
  #list{padding-bottom:14px}
  #search{left:418px}
  #theme{right:14px;bottom:14px}
}
@media (max-width:390px){
  #search{left:10px;right:62px}
  #search button{display:none}
  #sheet{height:82dvh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<form id="search" class="float"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Найти место или адрес" enterkeyhint="search" aria-label="Поиск"><button>Найти</button></form>
<div id="fabs" class="float">
  <button class="fab" id="locate" aria-label="Моё местоположение" title="Моё местоположение"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab" id="fit" aria-label="Показать все места" title="Показать все места"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="hint" class="float">Нажмите на карту, чтобы отметить место</div>
<div id="toast" class="float"><span id="tmsg"></span><button id="tundo">Отменить</button></div>
<button id="theme" aria-label="Переключить тему" title="Переключить тему">
<svg viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
</button>
<aside id="sheet">
  <div id="head"><div id="grab"></div><h1>Хочу побывать</h1><div id="count"></div></div>
  <div id="tabs"><button data-f="all" class="on">Все</button><button data-f="todo">Впереди</button><button data-f="done">Посетил</button></div>
  <form id="form"><label for="name">Название места</label><input id="name" maxlength="80" autocomplete="off" placeholder="Например, Летний сад">
    <div class="row"><button class="main">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form>
  <div id="list"></div>
</aside>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $=id=>document.getElementById(id), sheet=$('sheet');

const themeBtn=$('theme');
let savedTheme=localStorage.getItem('map-theme');
if(savedTheme) document.documentElement.dataset.theme=savedTheme;
function updateThemeIcon(){
  const dark=document.documentElement.dataset.theme==='dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches);
  themeBtn.innerHTML=dark
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>';
}
updateThemeIcon();
themeBtn.onclick=()=>{
  const current=document.documentElement.dataset.theme ||
    (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const next=current==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  localStorage.setItem('map-theme',next);
  updateThemeIcon();
};
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PIN='<svg viewBox="0 0 32 40"><path d="M16 1.5C8.3 1.5 2.5 7.4 2.5 15c0 10 13.5 23.5 13.5 23.500S29.5 25 29.5 15C29.5 7.4 23.7 1.5 16 1.500z" fill="currentColor" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg>';
const HOME=[59.926426,30.297316];
let places=[],markers={},rows={},draft=null,draftMarker=null,filter='all',meMarker=null,justAdded=null,snap='peek',toastT;
const wide=()=>matchMedia('(min-width:800px)').matches;

// Хранилище: облако Telegram (синхронизация между устройствами), иначе localStorage
const cloud=tg?.initData&&tg.CloudStorage;
const store={
  load(cb){
    if(!cloud){try{cb(JSON.parse(localStorage.getItem('places')||'[]'))}catch{cb([])}return}
    cloud.getKeys((e,keys)=>{keys=(keys||[]).filter(k=>k.startsWith('p_'));
      if(!keys.length)return cb([]);
      cloud.getItems(keys,(e,o)=>cb(Object.values(o||{}).map(v=>JSON.parse(v))))});
  },
  save(p){cloud?cloud.setItem('p_'+p.id,JSON.stringify(p)):localStorage.setItem('places',JSON.stringify(places))},
  del(p){cloud?cloud.removeItem('p_'+p.id):localStorage.setItem('places',JSON.stringify(places))}
};

// Карта (Санкт-Петербург)
const mapElement=$('map');

if(typeof L==='undefined'){
  mapElement.innerHTML='<div style="padding:24px;font:600 15px system-ui;color:#b42318;background:rgba(255,255,255,.92);margin:20px;border-radius:16px">Не удалось загрузить Leaflet. Обновите страницу или отключите блокировщик CDN.</div>';
  throw new Error('Leaflet failed to load');
}

const map=L.map(mapElement,{
  zoomControl:false,
  attributionControl:true,
  preferCanvas:true
}).setView(HOME,18);

const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  referrerPolicy:'strict-origin-when-cross-origin',
  attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'
}).addTo(map);

osm.on('tileerror',()=>toast('Не удалось загрузить фрагмент карты'));

if(wide())L.control.zoom({position:'bottomright'}).addTo(map);

requestAnimationFrame(()=>map.invalidateSize());
setTimeout(()=>map.invalidateSize(),250);
setTimeout(()=>map.invalidateSize(),1000);
const icon=(c,sz=[32,40])=>L.divIcon({className:'',html:`<div class="pin ${c}">${PIN}</div>`,iconSize:sz,iconAnchor:[16,40]});

// Шторка: три положения, перетаскивается
const SNAP={peek:()=>96,half:()=>innerHeight*.44,full:()=>sheet.offsetHeight};
function setSheet(name){
  snap=name;if(wide())return;
  const H=sheet.offsetHeight,v=SNAP[name]();
  sheet.style.setProperty('--ty',(H-v)+'px');sheet.style.setProperty('--hide',(H-v)+'px');
}
function visible(){return wide()?0:SNAP[snap]()}
function focus(lat,lng,z=map.getZoom()){ // ставим точку в центр видимой части карты
  const pt=map.project([lat,lng],z);
  if(wide())pt.x-=198;else pt.y+=visible()/2;
  map.flyTo(map.unproject(pt,z),z,{duration:.7});
}
let drag=null;const head=$('head');
head.addEventListener('pointerdown',e=>{if(wide())return;drag={y:e.clientY,t:Date.now(),v0:SNAP[snap](),moved:false};head.setPointerCapture(e.pointerId);sheet.classList.add('dragging')});
head.addEventListener('pointermove',e=>{if(!drag)return;const dy=e.clientY-drag.y;if(Math.abs(dy)>5)drag.moved=true;
  const H=sheet.offsetHeight,v=Math.max(SNAP.peek(),Math.min(H,drag.v0-dy));sheet.style.setProperty('--ty',(H-v)+'px')});
head.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;sheet.classList.remove('dragging');
  if(!d.moved)return setSheet(snap==='peek'?'half':'peek');
  const dy=e.clientY-d.y,vel=dy/Math.max(1,Date.now()-d.t),want=d.v0-dy-vel*180;
  setSheet(['peek','half','full'].sort((a,b)=>Math.abs(SNAP[a]()-want)-Math.abs(SNAP[b]()-want))[0]);tg?.HapticFeedback?.impactOccurred('light')});
addEventListener('resize',()=>{setSheet(snap);map.invalidateSize()});

function toast(msg,undo){
  $('tmsg').textContent=msg;$('tundo').style.display=undo?'':'none';$('tundo').onclick=()=>{undo();$('toast').classList.remove('on')};
  $('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('on'),5000);
}

function render(){
  Object.values(markers).forEach(m=>m.remove());markers={};rows={};
  const list=$('list');list.innerHTML='';
  const todo=places.filter(p=>!p.done).length;
  $('count').textContent=places.length?`${todo} впереди · ${places.length-todo} посещено`:'Пока нет мест';
  places.forEach(p=>{
    const m=markers[p.id]=L.marker([p.lat,p.lng],{icon:icon((p.done?'done ':'')+(p.id===justAdded?'new':''))}).addTo(map).bindTooltip(p.name,{direction:'top',offset:[0,-38]});
    m.on('click',()=>{if(!wide())setSheet('half');focus(p.lat,p.lng);const r=rows[p.id];if(r){r.scrollIntoView({block:'center',behavior:'smooth'});r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),1400)}});
  });
  justAdded=null;
  const vis=places.filter(p=>filter==='all'||(filter==='done')===p.done).sort((a,b)=>b.id-a.id);
  if(!vis.length)list.innerHTML=`<div class="empty">${places.length?'В этой вкладке пока пусто.':'Здесь будут места, куда хочется попасть.<br>Нажмите на карту или найдите адрес в поиске.'}</div>`;
  vis.forEach((p,i)=>{
    const r=document.createElement('div');r.className='item'+(p.done?' done':'');r.style.animationDelay=Math.min(i,8)*25+'ms';rows[p.id]=r;
    const c=document.createElement('button');c.className='chk';c.innerHTML=CHECK;c.setAttribute('aria-label',p.done?'Вернуть в «Впереди»':'Отметить как посещённое');
    const t=document.createElement('div');t.className='txt';
    const n=document.createElement('span');n.className='name';n.textContent=p.name;
    const dt=document.createElement('span');dt.className='date';dt.textContent=(p.done?'Были · ':'Добавлено ')+new Date(p.id).toLocaleDateString('ru',{day:'numeric',month:'short'});
    t.append(n,dt);
    const d=document.createElement('button');d.className='del';d.textContent='✕';d.setAttribute('aria-label','Удалить');
    r.onclick=()=>{if(!wide())setSheet('peek');focus(p.lat,p.lng,15)};
    c.onclick=e=>{e.stopPropagation();p.done=!p.done;store.save(p);tg?.HapticFeedback?.impactOccurred('medium');render()};
    d.onclick=e=>{e.stopPropagation();places=places.filter(x=>x!==p);store.del(p);render();
      toast(`«${p.name}» удалено`,()=>{places.push(p);store.save(p);render()})};
    r.append(c,t,d);list.append(r);
  });
  list.insertAdjacentHTML('beforeend','<div class="credits">Карта © OpenStreetMap contributors</div>');
}

function startDraft(lat,lng,name=''){
  clearDraft();draft={lat,lng};$('hint').classList.add('off');
  draftMarker=L.marker([lat,lng],{icon:icon('draft new')}).addTo(map);
  document.body.classList.add('drafting');setSheet('half');focus(lat,lng);
  $('name').value=name;setTimeout(()=>$('name').focus({preventScroll:true}),350);
}
function clearDraft(){draft=null;draftMarker?.remove();draftMarker=null;document.body.classList.remove('drafting')}
map.on('click',e=>{if(!drag)startDraft(e.latlng.lat,e.latlng.lng)});
$('cancel').onclick=()=>{clearDraft();if(!places.length)setSheet('peek')};
$('form').onsubmit=e=>{
  e.preventDefault();const name=$('name').value.trim();if(!name||!draft)return $('name').focus();
  const p={id:Date.now(),name,lat:draft.lat,lng:draft.lng,done:false};
  places.push(p);store.save(p);justAdded=p.id;clearDraft();filter='all';syncTabs();render();setSheet('peek');
  tg?.HapticFeedback?.notificationOccurred('success');toast(`«${name}» сохранено`);
};
function syncTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===filter))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;syncTabs();render()});

// Поиск по названию (Nominatim / OpenStreetMap)
$('search').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q)return;$('q').blur();
  try{
    const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q='+encodeURIComponent(q))).json();
    if(!r.length)return toast('Ничего не найдено');
    const {lat,lon,display_name}=r[0];startDraft(+lat,+lon,display_name.split(',')[0]);
  }catch{toast('Поиск недоступен, попробуйте позже')}
};

// Кнопки на карте
$('fit').onclick=()=>{if(!places.length)return focus(...HOME,12);
  const b=L.latLngBounds(places.map(p=>[p.lat,p.lng]));
  map.flyToBounds(b,{paddingTopLeft:[wide()?410:40,90],paddingBottomRight:[40,visible()+30],maxZoom:15,duration:.8})};
$('locate').onclick=()=>map.locate({setView:false,maxZoom:15});
map.on('locationfound',e=>{meMarker?.remove();meMarker=L.marker(e.latlng,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);focus(e.latlng.lat,e.latlng.lng,15)});
map.on('locationerror',()=>toast('Не удалось определить местоположение'));

setSheet('peek');
requestAnimationFrame(()=>map.invalidateSize());
store.load(p=>{places=p;render();if(p.length){$('fit').click();setSheet('half')}setTimeout(()=>$('hint').classList.add('off'),6000)});
</script>
</body>
</html>
